<text x="410" y="78" font-size="21" fill="#e4e7ee">Four faces of equal area</text>
<text x="410" y="106" font-size="15" fill="#a9b1bf">force the opposite edges to match:</text>
<line x1="410" y1="145" x2="454" y2="145" stroke="#5b8fdf" stroke-width="3.2" stroke-linecap="round"/>
<text x="470" y="150" font-size="19" font-style="italic" fill="#5b8fdf">AB = CD</text>
<text x="600" y="150" font-size="19" fill="#e4e7ee">= √5</text>
<line x1="410" y1="187" x2="454" y2="187" stroke="#e8664f" stroke-width="3.2" stroke-linecap="round"/>
<text x="470" y="192" font-size="19" font-style="italic" fill="#e8664f">AC = BD</text>
<text x="600" y="192" font-size="19" fill="#e4e7ee">= √10</text>
<line x1="410" y1="229" x2="454" y2="229" stroke="#efb532" stroke-width="3.2" stroke-linecap="round"/>
<text x="470" y="234" font-size="19" font-style="italic" fill="#efb532">AD = BC</text>
<text x="600" y="234" font-size="19" fill="#e4e7ee">= √13</text>
<text x="410" y="296" font-size="15" fill="#a9b1bf">Here: four corners of a 1 × 2 × 3 box.</text>
<text x="410" y="320" font-size="15" fill="#a9b1bf">Every face has sides √5, √10, √13</text>
<text x="410" y="344" font-size="15" fill="#a9b1bf">and area 7/2. It is not regular.</text>
