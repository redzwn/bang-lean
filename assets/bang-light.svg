<text x="470" y="192" font-size="19" font-style="italic" fill="#cb3a24">AC = BD</text>
<text x="600" y="192" font-size="19" fill="#1a2233">= √10</text>
<line x1="410" y1="229" x2="454" y2="229" stroke="#e1a614" stroke-width="3.2" stroke-linecap="round"/>
<text x="470" y="234" font-size="19" font-style="italic" fill="#8a6100">AD = BC</text>
<text x="600" y="234" font-size="19" fill="#1a2233">= √13</text>
<text x="410" y="296" font-size="15" fill="#5b6577">Here: four corners of a 1 × 2 × 3 box.</text>
<text x="410" y="320" font-size="15" fill="#5b6577">Every face has sides √5, √10, √13</text>
<text x="410" y="344" font-size="15" fill="#5b6577">and area 7/2. It is not regular.</text>
