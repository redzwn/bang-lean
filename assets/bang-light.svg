<text x="410" y="78" font-size="21" fill="#1a2233">Four faces of equal area</text>
<text x="410" y="106" font-size="15" fill="#5b6577">force the opposite edges to match:</text>
<line x1="410" y1="145" x2="454" y2="145" stroke="#1d4f9c" stroke-width="3.2" stroke-linecap="round"/>
<text x="470" y="150" font-size="19" font-style="italic" fill="#1d4f9c">AB = CD</text>
<text x="600" y="150" font-size="19" fill="#1a2233">= √5</text>
