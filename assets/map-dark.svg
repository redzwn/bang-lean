<defs><marker id="ah-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a9b1bf"/></marker></defs>
<text x="24" y="30" font-size="13" letter-spacing="1.5" fill="#a9b1bf">FROM MATHLIB</text>
<rect x="24" y="44" width="320" height="56" rx="6" fill="rgba(228,231,238,0.05)" stroke="#6d7685" stroke-width="1"/>
<text x="184.0" y="69" font-size="15.5" text-anchor="middle" fill="#e4e7ee">Heron's formula</text>
<text x="184.0" y="89" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#a9b1bf">volume_sq_eq_mul_sub_mul_sub_mul_sub</text>
<rect x="376" y="44" width="320" height="56" rx="6" fill="rgba(228,231,238,0.05)" stroke="#6d7685" stroke-width="1"/>
<text x="536.0" y="69" font-size="15.5" text-anchor="middle" fill="#e4e7ee">Independent vectors: Gram determinant ≠ 0</text>
<text x="536.0" y="89" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#a9b1bf">det_gram_ne_zero_iff_linearIndependent</text>
<text x="24" y="136" font-size="13" letter-spacing="1.5" fill="#a9b1bf">THIS PROJECT</text>
<rect x="24" y="150" width="320" height="76" rx="6" fill="rgba(228,231,238,0.05)" stroke="#5b8fdf" stroke-width="1.6"/>
<text x="184.0" y="175" font-size="15.5" text-anchor="middle" fill="#e4e7ee">4 · area² = ‖u‖²‖v‖² − ⟨u, v⟩²</text>
<text x="184.0" y="195" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#a9b1bf">four_mul_volume_sq</text>
<text x="184.0" y="213" font-size="12.5" text-anchor="middle" fill="#a9b1bf">the four face areas, from six numbers</text>
<rect x="376" y="150" width="320" height="76" rx="6" fill="rgba(228,231,238,0.05)" stroke="#5b8fdf" stroke-width="1.6"/>
<text x="536.0" y="175" font-size="15.5" text-anchor="middle" fill="#e4e7ee">det G ≠ 0 for a real tetrahedron</text>
<text x="536.0" y="195" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#a9b1bf">gram_det_ne_zero</text>
<text x="536.0" y="213" font-size="12.5" text-anchor="middle" fill="#a9b1bf">G = Gram matrix of the edges at one vertex</text>
<rect x="150" y="256" width="420" height="76" rx="6" fill="rgba(228,231,238,0.05)" stroke="#e8664f" stroke-width="1.6"/>
<text x="360.0" y="281" font-size="15.5" text-anchor="middle" fill="#e4e7ee">equal areas  ⟹  (‖c‖² − ‖a − b‖²) · det G = 0</text>
<text x="360.0" y="301" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#a9b1bf">eq_of_cofactor_eq</text>
<text x="360.0" y="319" font-size="12.5" text-anchor="middle" fill="#a9b1bf">one polynomial identity:  adj(adj G) = det G · G</text>
<rect x="150" y="358" width="420" height="56" rx="6" fill="rgba(228,231,238,0.05)" stroke="#efb532" stroke-width="1.6"/>
<text x="360.0" y="383" font-size="15.5" text-anchor="middle" fill="#e4e7ee">Equal face areas  ⟹  opposite edges equal</text>
<text x="360.0" y="403" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#a9b1bf">dist_eq_of_volume_faceOpposite_eq</text>
