<line x1="536" y1="100" x2="536" y2="148" stroke="#5b6577" stroke-width="1.3" marker-end="url(#ah-light)"/>
<line x1="184" y1="226" x2="250" y2="254" stroke="#5b6577" stroke-width="1.3" marker-end="url(#ah-light)"/>
<line x1="536" y1="226" x2="470" y2="254" stroke="#5b6577" stroke-width="1.3" marker-end="url(#ah-light)"/>
